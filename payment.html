<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment | Buxin Academy</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <nav class="navbar"><div class="container"><a href="home.html" class="logo">🤖 Buxin Academy</a></div></nav>
  <main class="container" style="padding:2rem 1rem;max-width:560px">
    <h1>Complete Payment</h1>
    <p id="class-type-label" class="opacity-70">Group Robotics Class</p>
    <p class="payment-amount" id="payment-amount">—</p>
    <p id="payment-intro" class="text-sm text-center opacity-70 mb-4">Choose how you want to pay</p>

    <form id="payment-form" class="glass" style="padding:1.5rem">
      <div id="payment-methods" class="payment-methods"></div>

      <div id="manual-receipt-block">
        <h3 class="mt-4 mb-2">Payment Instructions</h3>
        <ol class="text-sm opacity-70" style="padding-left:1.2rem;margin-bottom:1rem">
          <li>Send the exact amount shown above</li>
          <li>Take a screenshot of your confirmation</li>
          <li>Upload the receipt below</li>
          <li>Wait for admin approval (usually 24 hours)</li>
        </ol>

        <div class="form-group">
          <label>Upload Receipt (bank / transfer methods only)</label>
          <input type="file" id="receipt-file" accept="image/*" capture="environment">
          <img id="receipt-preview" class="hidden" alt="Receipt preview">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Submit receipt for approval</button>
      </div>
    </form>
  </main>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/modempay.js"></script>
  <script src="js/payments.js"></script>
</body>
</html>
