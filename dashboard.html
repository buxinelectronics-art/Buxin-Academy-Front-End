<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Buxin Academy</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="js/config.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js" defer></script>
</head>
<body data-page="dashboard">
  <nav class="navbar student-navbar">
    <div class="container navbar-inner">
      <a href="dashboard.html" class="logo">🤖 Buxin Academy</a>
      <div class="nav-actions">
        <button id="theme-toggle" type="button" aria-label="Toggle theme">🌙</button>
        <div class="student-nav-wrap">
          <button type="button" id="student-nav-toggle" class="btn btn-sm btn-secondary student-nav-toggle" aria-expanded="false" aria-controls="student-nav-menu">Menu</button>
          <div id="student-nav-menu" class="student-nav-menu">
            <a href="community.html" data-nav="community">Community</a>
            <a href="payment.html" data-nav="payment">Payment</a>
            <a href="#" id="student-nav-logout">Logout</a>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <div class="container dashboard-layout">
    <aside class="sidebar glass">
      <img id="user-avatar" class="hidden" style="width:64px;height:64px;border-radius:50%;margin-bottom:1rem" alt="">
      <p><strong id="user-name">—</strong></p>
      <p class="text-sm opacity-70" id="user-email">—</p>
      <ul class="sidebar-nav sidebar-nav--desktop mt-3">
        <li><a href="dashboard.html" class="active">Dashboard</a></li>
        <li><a href="community.html">Community</a></li>
        <li><a href="payment.html">Payment</a></li>
        <li><a href="#" id="logout-btn-side">Logout</a></li>
      </ul>
    </aside>

    <main class="dashboard-main">
      <div class="glass" style="padding:1.25rem">
        <span class="status-badge status-pending" id="user-status">pending</span>
        <p class="mt-2"><strong>Class:</strong> <span id="user-class">—</span></p>
        <p><strong>Country:</strong> <span id="user-country">—</span></p>
        <p><strong>Phone:</strong> <span id="user-phone">—</span></p>
        <p><strong>City:</strong> <span id="user-city">—</span></p>
        <p><strong>Experience:</strong> <span id="user-experience">—</span></p>
        <p><strong>Goals:</strong> <span id="user-goals">—</span></p>
        <p id="class-countdown" class="mt-3 text-sm"></p>
      </div>

      <div class="glass" style="padding:1.25rem">
        <h3>Live Classes</h3>
        <p class="text-sm opacity-70">Tap below to join your class directly.</p>
        <div id="class-links" class="mt-3"></div>
      </div>

      <div id="schedule-info" class="glass hidden" style="padding:1.25rem"></div>

      <div class="glass" style="padding:1.25rem">
        <h3>Latest Payment</h3>
        <p class="text-sm opacity-70 mb-2"><a href="payment.html">View full payment history →</a></p>
        <div id="payment-status-card" class="mt-2"></div>
      </div>

      <div class="glass" style="padding:1.25rem">
        <h3>Notifications</h3>
        <div id="notifications-list" class="mt-2"></div>
      </div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/payments.js"></script>
  <script src="js/dashboard.js"></script>
  <script>document.getElementById('logout-btn-side')?.addEventListener('click', (e) => { e.preventDefault(); Auth.logout(); });</script>
</body>
</html>
