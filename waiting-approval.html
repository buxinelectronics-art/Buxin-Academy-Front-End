<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pending Approval | Buxin Academy</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js" defer></script>
</head>
<body data-page="waiting">
  <nav class="navbar"><div class="container"><a href="waiting-approval.html" class="logo">🤖 Buxin Academy</a></div></nav>
  <main class="waiting-hero container">
    <div class="waiting-icon">⏳</div>
    <h1>Waiting for Approval</h1>
    <p>Hi <strong id="waiting-name">Student</strong> — your payment is being reviewed.</p>

    <div class="glass" style="padding:1.5rem;max-width:480px;margin:2rem auto;text-align:left">
      <p><strong>Class:</strong> <span id="waiting-class">—</span></p>
      <p><strong>Status:</strong> <span id="waiting-status" class="status-badge status-pending">pending</span></p>
      <p class="mt-3"><strong>Receipt:</strong></p>
      <img id="waiting-receipt" class="hidden receipt-thumb" alt="Your receipt" style="max-width:100%">
    </div>

    <p class="opacity-70 text-sm">You'll receive a notification once approved. Until then, only this page is available.</p>
    <p class="text-sm mt-3 opacity-70">Your dashboard, classes, and community unlock after approval.</p>
    <button type="button" id="waiting-logout" class="btn btn-secondary mt-3">Log out</button>
  </main>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/payments.js"></script>
  <script src="js/dashboard.js"></script>
  <script>
    document.getElementById('waiting-logout')?.addEventListener('click', () => Auth.logout());
  </script>
</body>
</html>
