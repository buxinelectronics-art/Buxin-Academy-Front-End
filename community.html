<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community | Buxin Academy</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js" defer></script>
</head>
<body data-page="community">
  <nav class="navbar">
    <div class="container">
      <a href="dashboard.html" class="logo">🤖 Community</a>
      <a href="dashboard.html" class="btn btn-sm btn-secondary">Dashboard</a>
    </div>
  </nav>

  <main class="container" style="padding:1.5rem 1rem;max-width:680px">
    <h1>Robotics Community</h1>
    <p class="opacity-70 mb-4">Share projects, discuss ideas, grow together</p>

    <form id="post-form" class="glass" style="padding:1rem;margin-bottom:1.5rem">
      <textarea id="post-content" class="input" rows="3" placeholder="Share your robotics project or question..."></textarea>
      <button type="submit" class="btn btn-primary">Post</button>
    </form>

    <div id="community-feed"></div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/community.js"></script>
</body>
</html>
