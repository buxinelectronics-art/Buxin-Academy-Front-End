<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community | Buxin Academy</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="js/config.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js" defer></script>
</head>
<body data-page="community">
  <nav class="navbar student-navbar">
    <div class="container navbar-inner">
      <a href="dashboard.html" class="logo">🤖 Buxin Academy</a>
      <div class="student-nav-wrap">
        <button type="button" id="student-nav-toggle" class="btn btn-sm btn-secondary student-nav-toggle" aria-expanded="false" aria-controls="student-nav-menu">Menu</button>
        <div id="student-nav-menu" class="student-nav-menu">
          <a href="community.html" data-nav="community">Community</a>
          <a href="payment.html" data-nav="payment">Payment</a>
          <a href="#" id="student-nav-logout">Logout</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="container" style="padding:1.5rem 1rem;max-width:680px">
    <h1>Robotics Community</h1>
    <p class="opacity-70 mb-4">Share projects, discuss ideas, grow together</p>

    <form id="post-form" class="glass" style="padding:1rem;margin-bottom:1.5rem">
      <textarea id="post-content" class="input" rows="3" placeholder="Write a message, paste a YouTube link, or add a photo…"></textarea>
      <div id="post-video-preview" class="post-video-preview hidden" aria-hidden="true"></div>
      <div class="form-group mt-2">
        <label class="text-sm opacity-70">Photos (optional, up to 5)</label>
        <input type="file" id="post-image" accept="image/*" multiple class="input">
        <div id="post-images-preview" class="post-images-preview hidden" aria-hidden="true"></div>
      </div>
      <button type="submit" class="btn btn-primary mt-2" id="post-submit-btn">Post</button>
    </form>

    <div id="community-feed"></div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/community.js"></script>
</body>
</html>
