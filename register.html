<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Buxin Academy</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <nav class="navbar"><div class="container"><a href="home.html" class="logo">🤖 Buxin Academy</a></div></nav>
  <main class="container" style="padding:2rem 1rem;max-width:520px">
    <h1>Create Account</h1>
    <p class="opacity-70 mb-4">Start your robotics journey</p>
    <form id="register-form" class="glass" style="padding:1.5rem">
      <div class="form-group"><label>Full Name</label><input type="text" id="full_name" required></div>
      <div class="form-group"><label>Email</label><input type="email" id="email" required></div>
      <div class="form-group"><label>Phone</label><input type="tel" id="phone" required></div>
      <div class="form-group"><label>City</label><input type="text" id="city" required></div>
      <div class="form-group"><label>Password</label><input type="password" id="password" required minlength="6"></div>
      <div class="form-group">
        <label>Class Type</label>
        <select id="class_type">
          <option value="group">Group Class (Sundays)</option>
          <option value="individual">Individual Mentorship (6 months)</option>
        </select>
      </div>
      <div id="individual-course-wrap" class="form-group hidden">
        <label>6-month course track *</label>
        <select id="selected_course">
          <option value="">Loading courses…</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Continue to Payment</button>
    </form>
    <p class="mt-3 text-sm"><a href="login.html">Already have an account?</a></p>
  </main>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/courses.js"></script>
  <script>
    if (!localStorage.getItem('buxinev_country')) location.href = 'index.html';
    const classTypeEl = document.getElementById('class_type');
    const courseWrap = document.getElementById('individual-course-wrap');
    const courseSel = document.getElementById('selected_course');
    function syncCourseField() {
      const isIndividual = classTypeEl.value === 'individual';
      courseWrap.classList.toggle('hidden', !isIndividual);
      courseSel.required = isIndividual;
    }
    void Courses.load().then(() => Courses.fillSelect(courseSel));
    classTypeEl.addEventListener('change', syncCourseField);
    const params = new URLSearchParams(location.search);
    if (params.get('type')) classTypeEl.value = params.get('type');
    syncCourseField();
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('[type=submit]');
      btn.disabled = true;
      try {
        const type = classTypeEl.value;
        const payload = {
          full_name: document.getElementById('full_name').value,
          email: document.getElementById('email').value,
          phone: document.getElementById('phone').value,
          city: document.getElementById('city').value,
          password: document.getElementById('password').value,
          ...BuxinEV.getRegistrationCountry(),
          class_type: type,
        };
        if (type === 'individual') payload.selected_course = courseSel.value;
        await Auth.register(payload);
        location.href = type === 'individual' ? 'individual-class.html?step=schedule' : `payment.html?type=${type}`;
      } catch (err) {
        BuxinEV.showToast(err.error || 'Registration failed', 'error');
      } finally { btn.disabled = false; }
    });
  </script>
</body>
</html>
