<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment successful | Buxin Academy</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="waiting">
  <main class="waiting-hero container">
    <div class="waiting-icon">✅</div>
    <h1>Payment successful</h1>
    <p class="opacity-70">Your account is active. Redirecting to your dashboard…</p>
  </main>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (async () => {
      if (!Auth.isLoggedIn()) {
        location.href = 'login.html';
        return;
      }
      const user = await Auth.refreshUser();
      if (user?.status === 'active') {
        setTimeout(() => { location.href = 'dashboard.html'; }, 1200);
      } else {
        location.href = 'waiting-approval.html';
      }
    })();
  </script>
</body>
</html>
